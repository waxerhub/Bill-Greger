<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Forge</title>
    <script>
      function cfError(msg) {
        var r = document.getElementById('root');
        if (r) r.innerHTML =
          '<div style="background:#08080d;color:#e08080;padding:20px;font-family:monospace;min-height:100vh;white-space:pre-wrap">' +
          '<div style="color:#c9a84c;font-size:16px;margin-bottom:12px">Character Forge — Error</div>' +
          String(msg) + '</div>';
      }
      window.onerror = function(msg, src, line) {
        cfError(String(msg) + '\n' + String(src) + ':' + line);
      };
      window.addEventListener('unhandledrejection', function(e) {
        cfError('Promise rejection: ' + String(e.reason));
      });
      // Fallback: if React hasn't mounted after 12s, show a diagnostic message
      window.__cfMounted = false;
      setTimeout(function() {
        if (!window.__cfMounted) {
          cfError(
            'App failed to start (scripts may not have loaded).\n\n' +
            'User agent: ' + navigator.userAgent + '\n\n' +
            'Try: hard-refresh (hold reload button), or check browser console for errors.'
          );
        }
      }, 12000);
    </script>
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;background:#08080d;color:#c9a84c;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:18px;letter-spacing:2px;">Loading Character Forge…</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
