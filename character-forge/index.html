<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Forge</title>
    <script>
      function cfError(msg) {
        var r = document.getElementById('root');
        if (r) r.innerHTML =
          '<div style="background:#08080d;color:#e08080;padding:20px;font-family:monospace;min-height:100vh;white-space:pre-wrap">' +
          '<div style="color:#c9a84c;font-size:16px;margin-bottom:12px">Character Forge — Error</div>' +
          String(msg) + '</div>';
      }
      window.onerror = function(msg, src, line) {
        cfError(String(msg) + '\n' + String(src) + ':' + line);
      };
      window.addEventListener('unhandledrejection', function(e) {
        cfError('Promise rejection: ' + String(e.reason));
      });
      // Fallback: if React hasn't mounted after 20s, show a helpful message
      window.__cfMounted = false;
      setTimeout(function() {
        if (!window.__cfMounted) {
          cfError(
            'App took too long to load.\n\n' +
            'This usually happens on first visit when the server needs ~30 seconds to wake up.\n\n' +
            'Please hard-refresh the page (on iOS: hold the reload button \u21ba, then tap "Reload").\n\n' +
            'Browser: ' + navigator.userAgent
          );
        }
      }, 20000);
    </script>
  </head>
  <body>
    <style>
      #cf-slow{display:none;margin-top:16px;font-size:12px;color:#7a7080;font-family:monospace;}
      @keyframes cf-show{to{opacity:1}}
      @media(prefers-reduced-motion:no-preference){
        #cf-slow{display:block;opacity:0;animation:cf-show 0s 7s forwards;}
      }
    </style>
    <div id="root"><div style="min-height:100vh;background:#08080d;color:#c9a84c;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Georgia,serif;font-size:18px;letter-spacing:2px;">Loading Character Forge…<div id="cf-slow">Server warming up — please wait a moment…</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
